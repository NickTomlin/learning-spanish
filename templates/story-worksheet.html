<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>$title · Español</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="../css/worksheet.css">
<link rel="stylesheet" href="../css/story-worksheet.css">
</head>
<body>
<div class="ws-shell">
  <section class="paper">
    <div class="paper-head">
      <div>
        <p class="paper-kicker">Worksheet</p>
        <h1 class="paper-title">$title</h1>
      </div>
      <div class="name-date">
        <div>Nombre <span></span></div>
        <div>Fecha <span class="short"></span></div>
      </div>
    </div>
    <div class="paper-meta"><div class="paper-instructions">$instructions</div></div>
    <ol class="story-list">$questions</ol>
    <div class="paper-foot"><span>$count questions</span><span>$title</span></div>
  </section>
  $answer_key
</div>
</body>
</html>
