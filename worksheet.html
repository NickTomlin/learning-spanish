<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worksheet · Español</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/worksheet.css">
</head>
<body>
<div id="app"></div>
<script type="module">
  import { loadSheet, sheetCatalog } from './sheets/index.js';
  import { mountWorksheetPage } from './lib/worksheet-page.js';

  const app = document.getElementById('app');
  const catalog = sheetCatalog();
  // This page is linked straight from the nav, so a bare visit is normal:
  // open the first sheet and let the sheet tabs take it from there.
  const id = new URL(window.location.href).searchParams.get('sheet') || catalog[0].id;

  try {
    mountWorksheetPage(await loadSheet(id), app, { catalog });
  } catch (err) {
    const links = catalog
      .map((s) => `<a href="?sheet=${encodeURIComponent(s.id)}">${s.title}</a>`)
      .join(' · ');
    app.innerHTML = `
      <div class="ws-shell">
        <div class="ws-error">
          <strong>${err.message}</strong>
          <p style="margin: 8px 0 0;">Available worksheets: ${links}</p>
        </div>
      </div>`;
  }
</script>
</body>
</html>
